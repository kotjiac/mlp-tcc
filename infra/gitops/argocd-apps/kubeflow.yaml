apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow
  namespace: argocd
spec:
  # Seção de destino permanece a mesma
  destination:
    namespace: kubeflow
    server: https://kubernetes.default.svc
  project: default
  
  # Seção de origem permanece a mesma
  source:
    path: infra/gitops/argocd-apps/kubeflow/manifests/example
    repoURL: 'https://github.com/kotjiac/mlp-tcc.git'
    targetRevision: master
    
  # --- SEÇÃO DE POLÍTICA DE SINCRONIZAÇÃO AJUSTADA ---
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # A política de retry foi adicionada para espelhar seu 'while loop',
    # tornando a instalação mais resiliente a falhas temporárias.
    retry:
      limit: 5 # Tenta sincronizar até 5 vezes em caso de falha.
      backoff:
        duration: 20s # Começa com uma espera de 20 segundos.
        factor: 2 # Dobra o tempo de espera a cada nova tentativa (20s, 40s, 80s...).
        maxDuration: 5m # A espera máxima entre as tentativas não passará de 5 minutos.

  # --- SEÇÃO DE OPÇÕES DE SINCRONIZAÇÃO CORRIGIDA ---
  # Removemos a opção conflitante e mantivemos a 'Replace=true',
  # que é a estratégia mais agressiva e provável de replicar o sucesso
  # do seu comando --force-conflicts, pois evita os conflitos de campo.
  syncOptions:
    - CreateNamespace=true
    - Replace=true