
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow
  namespace: argocd
spec:
  destination:
    namespace: kubeflow
    server: https://kubernetes.default.svc
  project: default
  source:
    path: infra/gitops/argocd-apps/kubeflow/manifests/example
    repoURL: 'https://github.com/kotjiac/mlp-tcc.git'
    targetRevision: master
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5 
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
  syncOptions:
    - CreateNamespace=true
    - Replace=true